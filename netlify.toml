# Sitio estático: no hay build, Netlify publica la raíz tal cual.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # La lista tiene nombres y teléfonos: que los buscadores no la indexen
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Siempre pedir la versión más reciente al actualizar los registros
    Cache-Control = "public, max-age=0, must-revalidate"
